    <script>
      // Apply the saved palette before the stylesheet paints, preventing a
      // light/pink flash while React and the settings database initialise.
      (() => {
        const themes = {
          light: { background: "#f8f9fb", icon: "favicon-light.svg" },
          dark: { background: "#0f141b", icon: "favicon-dark.svg" },
          beige: { background: "#f8f4ea", icon: "favicon-beige.svg" },
          sakura: { background: "#fff8fa", icon: "favicon-sakura.svg" },
        };
        const savedTheme = localStorage.getItem("flashcards-theme");
        const systemTheme = window.matchMedia?.("(prefers-color-scheme: dark)")
          .matches
          ? "dark"
          : "light";
        const theme = themes[savedTheme] ? savedTheme : systemTheme;
        const baseUrl = "/memini/";

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme =
          theme === "dark" ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content =
          themes[theme].background;
        document.querySelector('[data-theme-icon="favicon"]').href =
          `${baseUrl}icons/themes/${themes[theme].icon}`;
      })();
    </script>
